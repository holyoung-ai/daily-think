<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>每日一思 · 成年人的逻辑题</title>
<style>
:root{
  --paper:#F7F4EC; --ink:#2A2722; --ink2:#4E483F; --muted:#8A8175;
  --rule:#D6CCB8; --accent:#3E5C50; --accent2:#8C5A3C;
  --serif:"Songti SC","STSong","SimSun",Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:#E7E2D6;color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.85;padding:20px 14px 46px;
}
.wrap{max-width:620px;margin:0 auto}
header{text-align:center;padding:14px 0 18px}
h1{margin:0;font-family:var(--serif);font-size:26px;letter-spacing:.22em;font-weight:600}
.latin{margin:8px 0 0;font-family:Georgia,serif;font-size:10.5px;letter-spacing:.4em;color:var(--muted)}
.rule{display:flex;align-items:center;gap:12px;margin:16px auto;max-width:300px;color:var(--rule)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent)}
.rule span{font-size:8px;color:var(--accent)}
.meta{font-size:12px;letter-spacing:.14em;color:var(--muted)}

.card{background:var(--paper);border:1px solid var(--rule);padding:22px 20px 18px;
  box-shadow:0 10px 30px -22px rgba(60,50,30,.7);position:relative}
.card::after{content:"";position:absolute;inset:6px;border:1px solid rgba(214,204,184,.5);pointer-events:none}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.16em;color:var(--accent);
  border:1px solid #BCCBC3;background:#EEF3EF;padding:2px 8px}
.lv{font-size:10px;letter-spacing:3px;color:var(--accent2);margin-left:8px}
.q{margin:14px 0 6px;font-family:var(--serif);font-size:18px;line-height:2;white-space:pre-wrap}
.acts{display:flex;gap:10px;margin-top:18px}
button{font-family:inherit;font-size:13.5px;letter-spacing:.14em;padding:10px 18px;cursor:pointer;
  border:1px solid var(--ink);background:transparent;color:var(--ink);transition:.2s}
button:hover{background:var(--ink);color:var(--paper)}
button.primary{background:var(--ink);color:var(--paper)}
.panel{margin-top:14px;padding:13px 15px;font-size:14px;line-height:1.95;animation:fade .2s ease}
.panel.hint{background:#EFEADC;border-left:3px solid var(--rule);color:var(--ink2)}
.panel.ans{background:#EEF3EF;border-left:3px solid var(--accent);color:#24413A}
.panel .lbl{display:block;font-size:10px;letter-spacing:.22em;color:var(--muted);margin-bottom:3px}
.hidden{display:none}
details.why{margin-top:16px;border-top:1px dashed var(--rule);padding-top:12px}
details.why summary{cursor:pointer;list-style:none;font-size:12px;letter-spacing:.12em;color:var(--muted)}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"▸ ";font-size:10px}
details.why[open] summary::before{content:"▾ "}
details.why .body{margin-top:10px;font-size:14px;line-height:2;color:var(--ink2)}

.past{margin-top:34px}
.past h2{font-size:12px;letter-spacing:.28em;color:var(--muted);font-weight:400;
  border-bottom:1px solid var(--rule);padding-bottom:8px;margin:0 0 4px}
details.item{border-bottom:1px solid #DCD3C0}
details.item>summary{cursor:pointer;list-style:none;padding:12px 2px;display:flex;gap:10px;align-items:baseline}
details.item>summary::-webkit-details-marker{display:none}
details.item .no{font-size:10.5px;color:var(--muted);min-width:40px}
details.item .txt{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.item .date{font-size:10.5px;color:var(--muted);min-width:46px;text-align:right}
details.item .inner{padding:2px 2px 14px 50px;font-size:14px;line-height:1.95;color:var(--ink2)}
details.item .inner .a{color:var(--accent);font-weight:700}

.foot{margin-top:34px;text-align:center;font-size:11px;color:var(--muted);line-height:2;letter-spacing:.06em}
@media (max-width:380px){ h1{font-size:22px} .q{font-size:16.5px} }
</style>
</head>

/* ---------- 日期：每天一题 ---------- */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function ymd(d){ return d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日'; }
function dateOfIndex(i){ var d = new Date(START); d.setDate(d.getDate() + i); return d; }
function dayIndex(d){
  var a = new Date(START.getFullYear(), START.getMonth(), START.getDate());
  var b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.max(0, Math.round((b - a) / 86400000));
}
function shortDate(d){ return (d.getMonth()+1) + '/' + d.getDate(); }

var today = new Date();
var idx = Math.min(dayIndex(today), QS.length - 1);
var cur = QS[idx];

document.getElementById('meta').textContent =
  ymd(today) + '　·　第 ' + (idx + 1) + ' 题';

var card = document.getElementById('card');
var stars = '★★★'.slice(0, cur.lv) + '☆☆☆'.slice(0, 3 - cur.lv);
card.innerHTML =
  '<span class="tag">' + cur.tag + '</span><span class="lv">' + stars + '</span>' +
  '<div class="q">' + cur.q.replace(/\n/g, '<br>') + '</div>' +
  '<div class="acts">' +
    '<button id="b-hint" type="button">给点提示</button>' +
    '<button class="primary" id="b-ans" type="button">看答案</button>' +
  '</div>' +
  '<div class="panel hint hidden" id="p-hint"><span class="lbl">提 示</span>' + cur.hint + '</div>' +
  '<div class="panel ans hidden" id="p-ans"><span class="lbl">答 案</span>' + cur.a + '</div>' +
  '<details class="why"><summary>解析</summary><div class="body">' + cur.why + '</div></details>';

var ph = document.getElementById('p-hint'), pa = document.getElementById('p-ans');
document.getElementById('b-hint').onclick = function(){
  ph.classList.toggle('hidden');
  this.textContent = ph.classList.contains('hidden') ? '给点提示' : '收起提示';
};
document.getElementById('b-ans').onclick = function(){
  pa.classList.toggle('hidden');
  this.textContent = pa.classList.contains('hidden') ? '看答案' : '收起答案';
};

/* ---------- 往期 ---------- */
var past = document.getElementById('past');
if (idx === 0) {
  past.innerHTML = '<div style="padding:20px 4px;color:#8A8175;font-size:13px">今天是第一题。</div>';
} else {
  var h = '';
  for (var i = idx - 1; i >= 0; i--) {
    var it = QS[i], d = dateOfIndex(i);
    h += '<details class="item"><summary>' +
      '<span class="no">第' + (i+1) + '题</span>' +
      '<span class="txt">' + it.q.split('\n')[0] + '</span>' +
      '<span class="date">' + shortDate(d) + '</span>' +
      '</summary><div class="inner">' + it.q.replace(/\n/g,'<br>') +
      '<div style="margin-top:10px"><span class="lbl" style="font-size:10px;letter-spacing:.2em;color:#8A8175">答 案</span><br><span class="a">' + it.a + '</span></div>' +
      '<div style="margin-top:8px;color:#4E483F">' + it.why + '</div>' +
      '</div></details>';
  }
  past.innerHTML = h;
}
</script>
</body>
</html>
